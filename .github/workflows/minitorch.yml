name: MiniTorch modules 0-2

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      NUMBA_NUM_THREADS: "4"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Check Python syntax
        run: python -m compileall -q minitorch project tests

      - name: Test completed modules
        run: >-
          python -m pytest tests -q -x
          -m "task0_1 or task0_2 or task0_3 or task0_4 or
              task1_1 or task1_2 or task1_3 or task1_4 or
              task2_1 or task2_2 or task2_3 or task2_4"
